name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run headless tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -c pytest.ini tests

      - name: Determine version
        id: version
        run: |
          if ($env:GITHUB_REF -match 'refs/tags/v(.*)') {
            $version = $matches[1]
          } else {
            $date = Get-Date -Format "yyyy.MM.dd"
            $commit = $env:GITHUB_SHA.Substring(0, 7)
            $version = "0.2.0-dev.$date.$commit"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "VERSION=$version"

      - name: Build executable with PyInstaller
        run: |
          python -m PyInstaller --clean --noconfirm build.spec

      - name: Verify executable
        run: |
          $exe = "dist\AutomatizadorFichas.exe"
          if (Test-Path $exe) {
            $size = (Get-Item $exe).Length / 1MB
            Write-Host "Executable found: $exe (Size: $([math]::Round($size, 2)) MB)"
            if ($size -lt 15) {
              Write-Error "Executable too small ($size MB), build may have failed"
              exit 1
            }
          } else {
            Write-Error "Executable not found at $exe"
            exit 1
          }

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Automatizador de Fichas v${{ steps.version.outputs.version }}"
          body: |
            ## Automatizador de Fichas v${{ steps.version.outputs.version }}

            ### Principais Novidades
            - **Nova Interface PySide6**: `MainWindow` moderna com `QSplashScreen`, navegação em 5 etapas (`Ctrl+1..5`), `QDockWidget` de logs/validação, `StatusBar` interativa e notificações `Toast`.
            - **Sistema de Temas Dual**: 4 temas de aplicação (`Claro`, `Escuro`, `Alto Contraste`, `Sistema`) + 5 temas de editor SQL (`VSCode`, `Monokai`, `Dracula`, `GitHub`, `Solarized`).
            - **Editor SQL Nativo (`SqlEditorWidget`)**: realce PostgreSQL + Jasper (`$P{}`, `$X{}`, `$P!{}`), numeração de linhas (`LineNumberArea`), busca/substituição (`Ctrl+F`, `Ctrl+H`, `F3`, `Shift+F3`) e sincronização em tempo real com as configurações.
            - **Opções Avançadas do SELECT Jasper**: 4 estilos booleanos, 3 modos de nomenclatura de colunas (`label_only` padrão), controle de `_obs`, metadados e blocos adicionais (`Cabeçalho`, `Paciente`, `Profissional`, `Atendimento`) com preview em tempo real e persistência entre sessões.
            - **11 Tipos de Campo Salutem Unificados**: suporte completo a `BOOLEANO`, `BOOLEANO_RADIO`, `COMBO`, `COMBO_MULTI`, `TEXTO`, `TEXTO_LONGO`, `DATA`, `HORA`, `NUMERICO`, `TITULO` e `CID`.
            - **Auto-Updater GitHub Releases**: verificação automática a cada 24h no startup ou manual em *Configurações → Geral*, visualização de Release Notes em Markdown e atualização automatizada do executável.

            Consulte o [CHANGELOG.md](https://github.com/fernandocalisto/automatizador-fichas/blob/main/CHANGELOG.md) para a lista completa de alterações.
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/AutomatizadorFichas.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (for non-tag builds)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: AutomatizadorFichas-${{ steps.version.outputs.version }}-windows
          path: dist/AutomatizadorFichas.exe
          retention-days: 7
